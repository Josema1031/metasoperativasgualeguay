<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Metas Operativas | Ingreso</title>
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body class="bg-app">

  <main class="login-wrap">
    <section class="card login-card">
      <h1>Metas Operativas</h1>
      <p class="muted">Sección Gualeguay</p>

      <form id="loginForm" class="form-grid">
        <label>
          Correo electrónico
          <input type="email" id="email" placeholder="correo@gna.gob.ar" required>
        </label>

        <label>
          Contraseña
          <input type="password" id="password" placeholder="********" required>
        </label>

        <button type="submit" class="btn btn-primario">Ingresar</button>
      </form>

      <p id="loginMsg" class="msg"></p>
    </section>
  </main>

  <script type="module" src="./js/login.js"></script>
</body>
</html>
